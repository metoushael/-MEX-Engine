# Compile MEX pour Linux, Windows, macOS et le web, puis publie les fichiers dans les
# « Releases » du dépôt GitHub : sous Windows et Linux, l'éditeur tient en un seul fichier.
#
# - Envoi sur la branche principale (main ou master) : les archives remplacent celles
#   de la préversion « Dernière compilation » (étiquette « continu »). Elle suit donc
#   toujours le dernier envoi.
# - Étiquette « v... » : une version numérotée est publiée.
#
#       git tag v0.5.1
#       git push origin v0.5.1
#
# - Sans ligne de commande : onglet « Actions », « Compilation et publication »,
#   bouton « Run workflow », champ « Version à publier » (par exemple v0.5.1).
#   L'étiquette est créée par le flux de travail. Champ vide : « Dernière compilation ».
# - Demande de fusion : compilation et essais seulement, rien n'est publié. Les archives
#   restent quand même téléchargeables depuis la page de l'exécution (Artifacts).
#
# Si l'étape « Publication » échoue avec « Resource not accessible by integration » :
# Settings > Actions > General > Workflow permissions > « Read and write permissions ».
name: Compilation et publication

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v0.5.1). Vide : « Dernière compilation »."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Décide du nom des archives et de ce qui sera publié.
  prepare:
    name: Préparation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      label: ${{ steps.plan.outputs.label }}
      tag: ${{ steps.plan.outputs.tag }}
      kind: ${{ steps.plan.outputs.kind }}
    steps:
      - name: Plan de publication
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          short=${GITHUB_SHA::7}
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$REQUESTED" ]; then
            # Version demandée à la main : « 0.5.1 » est accepté pour « v0.5.1 ».
            tag="v${REQUESTED#v}"
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.]+)?$'; then
              echo "::error::Version invalide : « $REQUESTED ». Exemples : v0.5.1, v1.0.0-beta1."
              exit 1
            fi
            kind=version; label="$tag"; version="${tag#v}"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"; kind=version; label="$tag"; version="${tag#v}"
          elif [ "$EVENT" = "pull_request" ]; then
            tag=""; kind=aucune; label="dev"; version="dev-$short"
          else
            tag="continu"; kind=continu; label="continu"; version="dev-$short"
          fi
          {
            echo "version=$version"
            echo "label=$label"
            echo "tag=$tag"
            echo "kind=$kind"
          } >> "$GITHUB_OUTPUT"
          echo "Version : $version, archives : mex-$label-*, publication : $kind $tag" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-24.04
            platform: linux-x86_64
            shell: bash
          - name: Windows (x86_64)
            os: windows-latest
            platform: windows-x86_64
            shell: msys2 {0}
          - name: macOS (Intel et Apple Silicon)
            os: macos-latest
            platform: macos-universal
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      # Version affichée par le moteur (« 0.5.1 », ou « dev-1a2b3c4 » hors version numérotée).
      VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE: mex-${{ needs.prepare.outputs.label }}-${{ matrix.platform }}

    steps:
      - name: Récupération des sources
        uses: actions/checkout@v7

      # SDL2 est compilée avec le moteur (MEX_VENDORED_SDL) : libsdl2-dev n'est
      # installé que pour ses dépendances, les en-têtes de X11, Wayland, ALSA,
      # PulseAudio, PipeWire... dont SDL2 a besoin pour activer ces pilotes.
      - name: Outils (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libgl-dev

      - name: Outils (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            zip

      - name: Compilation (Linux, Windows)
        if: runner.os != 'macOS'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMEX_VENDORED_SDL=ON \
            -DMEX_STATIC_RUNTIME=ON \
            -DMEX_VERSION="$VERSION"
          cmake --build build
          mkdir -p dist
          cp build/bin/mex* dist/
          # Retire les symboles de débogage : exécutables plus légers.
          strip dist/mex*

      # Une compilation par architecture, réunies ensuite en un seul binaire.
      - name: Compilation (macOS)
        if: runner.os == 'macOS'
        run: |
          for arch in arm64 x86_64; do
            cmake -S . -B "build-$arch" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="$arch" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
              -DMEX_VENDORED_SDL=ON \
              -DMEX_VERSION="$VERSION"
            cmake --build "build-$arch" --parallel 4
          done
          mkdir -p dist
          for exe in mex mex-jeu; do
            lipo -create -output "dist/$exe" "build-arm64/bin/$exe" "build-x86_64/bin/$exe"
            codesign --force --sign - "dist/$exe"
            lipo -info "dist/$exe"
          done

      - name: Dépendances de l'exécutable
        run: |
          case "$RUNNER_OS" in
            Linux) ldd dist/mex ;;
            macOS) otool -L dist/mex ;;
            Windows)
              objdump -p dist/mex.exe | grep "DLL Name" | sort -u
              # Ni SDL2.dll ni les DLL de MinGW ne doivent être nécessaires.
              if objdump -p dist/mex.exe | grep -Eiq "DLL Name: (SDL2|libstdc|libgcc|libwinpthread)"; then
                echo "::error::mex.exe dépend d'une DLL qui n'est pas fournie avec Windows"
                exit 1
              fi
              ;;
          esac

      # Le jeu d'exemple tourne 120 images sans écran ni carte son.
      - name: Essai du jeu d'exemple
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          essai() {
            echo "--- $*"
            "$@" > essai.log 2>&1 || { cat essai.log; echo "::error::Échec de : $*"; exit 1; }
            cat essai.log
            if grep -q "ERREUR" essai.log; then
              echo "::error::Le moteur a signalé une erreur : $*"
              exit 1
            fi
          }
          essai dist/mex --version
          essai dist/mex --path projects/plateforme --quit-after 120
          essai dist/mex-jeu --path projects/plateforme principal.scn --quit-after 120
          # Sans écran il n'y a pas d'OpenGL : la démo 3D doit tourner quand même (scripts et
          # physique), le moteur se contentant d'avertir que le rendu 3D est désactivé.
          essai dist/mex-jeu --path projects/demo3d --quit-after 120
          essai dist/mex -e --path projects/demo3d --quit-after 30
          # Éditeur lancé hors d'un projet : page d'accueil (gestionnaire de projets).
          mkdir -p vide
          (cd vide && essai ../dist/mex --quit-after 30)

      # Sous Linux, le rendu 3D est essayé pour de bon : serveur X virtuel et OpenGL logiciel
      # de Mesa (llvmpipe). Les exécuteurs Windows et macOS n'offrent pas d'équivalent simple.
      - name: Essai du rendu 3D (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          export SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1280x720x24" dist/mex-jeu --path projects/demo3d \
            --quit-after 60 --screenshot demo3d.bmp > essai3d.log 2>&1 || { cat essai3d.log; exit 1; }
          cat essai3d.log
          if grep -Eq "ERREUR|OpenGL indisponible" essai3d.log; then
            echo "::error::Le rendu 3D n'a pas fonctionné"
            exit 1
          fi
          test -s demo3d.bmp
          rm -f demo3d.bmp essai3d.log

      # Les exécutables partent tels quels : la tâche « Assemblage » en fait les fichiers publiés.
      - name: Envoi des exécutables
        uses: actions/upload-artifact@v7
        with:
          name: binaires-${{ matrix.platform }}
          path: dist/mex*
          if-no-files-found: error

  # Modèle d'export web : le moteur de jeu compilé en WebAssembly (un seul fichier mex-jeu.js).
  web:
    name: Web (WebAssembly)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      EMSCRIPTEN_VERSION: 3.1.74
    steps:
      - name: Récupération des sources
        uses: actions/checkout@v7

      - name: Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"

      - name: Compilation
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMEX_VERSION="$VERSION"
          cmake --build build-web
          mkdir -p dist
          cp build-web/bin/mex-jeu.js dist/
          ls -l dist
          test -s dist/mex-jeu.js

      - name: Envoi du modèle web
        uses: actions/upload-artifact@v7
        with:
          name: binaires-web-wasm32
          path: dist/mex-jeu.js
          if-no-files-found: error

  # Réunit les exécutables de tous les systèmes : l'éditeur de Windows et celui de Linux
  # reçoivent les modèles d'export de tous les systèmes et tiennent chacun en un seul fichier.
  package:
    name: Assemblage
    needs: [prepare, build, web]
    # Un système qui n'a pas compilé est laissé de côté ; les autres sont assemblés.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LABEL: ${{ needs.prepare.outputs.label }}
    steps:
      - name: Récupération des sources
        uses: actions/checkout@v7

      - name: Récupération des exécutables
        uses: actions/download-artifact@v8
        with:
          path: binaires
          pattern: binaires-*

      - name: Assemblage
        run: |
          ls -lR binaires
          bash tools/assembler_publication.sh binaires "$LABEL" publication

      # L'éditeur Linux en un seul fichier, seul dans un dossier vide, exporte le jeu d'exemple
      # (Linux, web, Windows) puis le jeu exporté est lancé.
      - name: Essai de l'éditeur en un seul fichier
        run: |
          systemes=""
          if [ -f binaires/binaires-web-wasm32/mex-jeu.js ]; then systemes="$systemes web"; fi
          if [ -f binaires/binaires-windows-x86_64/mex-jeu.exe ]; then systemes="$systemes windows"; fi
          bash tools/essai_fichier_unique.sh "publication/mex-$LABEL-linux-x86_64" $systemes

      # L'archive complète : l'éditeur sans modèles incorporés les trouve dans « templates ».
      - name: Essai de l'archive complète
        run: |
          systemes=""
          if [ -f binaires/binaires-web-wasm32/mex-jeu.js ]; then systemes="$systemes web"; fi
          if [ -f binaires/binaires-windows-x86_64/mex-jeu.exe ]; then systemes="$systemes windows"; fi
          if [ -f binaires/binaires-macos-universal/mex-jeu ]; then systemes="$systemes macos"; fi
          bash tools/essai_archive_complete.sh "publication/mex-$LABEL-linux-x86_64.tar.gz" $systemes

      - name: Envoi des fichiers à publier
        uses: actions/upload-artifact@v7
        with:
          name: mex-${{ needs.prepare.outputs.label }}
          path: publication/*
          if-no-files-found: error

  release:
    name: Publication
    needs: [prepare, package]
    # Publie les systèmes qui ont réussi, même si un autre a échoué.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.package.result == 'success' && needs.prepare.outputs.kind != 'aucune' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    # Deux publications de la même version ne se croisent jamais.
    concurrency:
      group: publication-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Récupération des fichiers
        uses: actions/download-artifact@v8
        with:
          name: mex-${{ needs.prepare.outputs.label }}
          path: release

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          LABEL: ${{ needs.prepare.outputs.label }}
          KIND: ${{ needs.prepare.outputs.kind }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd release
          count=$(find . -maxdepth 1 -name 'mex-*' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::Aucun fichier à publier : toutes les compilations ont échoué."
            exit 1
          fi
          sha256sum mex-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

          {
            if [ "$KIND" = "continu" ]; then
              echo "Compilation automatique du dernier envoi sur la branche \`$GITHUB_REF_NAME\` (\`${GITHUB_SHA::7}\`, version \`$VERSION\`)."
              echo "Elle est remplacée à chaque envoi : pour une version stable, prenez une version numérotée."
              echo
            fi
            echo "## Téléchargements"
            echo
            echo "| Système | Fichier |"
            echo "| --- | --- |"
            echo "| Windows 10 ou 11 (64 bits) | \`mex-$LABEL-windows-x86_64.exe\` : un seul fichier, rien à décompresser |"
            echo "| Windows, version console (facultative) | \`mex-$LABEL-windows-x86_64.console.exe\`, à placer à côté du premier |"
            echo "| Linux x86_64 (glibc 2.39 ou plus récente : Ubuntu 24.04, Debian 13, Fedora 40...) | \`mex-$LABEL-linux-x86_64\` : un seul fichier |"
            echo "| macOS 11 ou plus récent (Intel et Apple Silicon) | \`mex-$LABEL-macos-universal.tar.gz\` |"
            echo
            echo "Tous ces fichiers contiennent les modèles d'export de tous les systèmes (Windows, Linux, macOS, web)."
            echo
            echo "## Archives complètes"
            echo
            echo "Tout ce que la compilation a produit pour un système (éditeur, version console, lanceur \`mex-jeu\`), avec les modèles d'export de **tous** les systèmes dans le dossier \`templates\`."
            echo
            echo "| Système | Fichier |"
            echo "| --- | --- |"
            echo "| Windows | \`mex-$LABEL-windows-x86_64.zip\` |"
            echo "| Linux | \`mex-$LABEL-linux-x86_64.tar.gz\` |"
            echo "| macOS | \`mex-$LABEL-macos-universal.tar.gz\` |"
            echo "| Web (modèle d'export seul) | \`mex-$LABEL-web-wasm32.zip\` |"
            echo
            echo "## Autres fichiers"
            echo
            echo "| Contenu | Fichier |"
            echo "| --- | --- |"
            echo "| Paquet des modèles d'export de tous les systèmes | \`mex-$LABEL-modeles-export.tpz\`, à installer par *Projet > Modèles d'exportation...* |"
            echo "| Projets d'exemple | \`mex-$LABEL-exemples.zip\` |"
            echo "| Sommes de contrôle | \`SHA256SUMS.txt\` |"
            echo
            echo "**Windows :** téléchargez le fichier \`.exe\` et lancez-le. Il contient l'éditeur et les modèles d'export (Windows, Linux, macOS, web)."
            echo
            echo "**Linux :** après le téléchargement, rendez le fichier exécutable puis lancez-le :"
            echo
            echo "    chmod +x mex-$LABEL-linux-x86_64"
            echo "    ./mex-$LABEL-linux-x86_64"
            echo
            echo "**macOS :** les exécutables ne sont pas signés par un développeur identifié. Après la décompression, dans le Terminal :"
            echo
            echo "    xattr -dr com.apple.quarantine mex-$LABEL-macos-universal"
            missing=""
            [ -f "mex-$LABEL-windows-x86_64.exe" ] || missing="$missing Windows"
            [ -f "mex-$LABEL-linux-x86_64" ] || missing="$missing Linux"
            [ -f "mex-$LABEL-macos-universal.tar.gz" ] || missing="$missing macOS"
            [ -f "mex-$LABEL-web-wasm32.zip" ] || missing="$missing web"
            if [ -n "$missing" ]; then
              echo
              echo "> **Attention :** la compilation a échoué pour :$missing. Ces fichiers manquent dans cette publication."
            fi
          } > ../notes.md

          if [ "$KIND" = "continu" ]; then
            # Préversion glissante : l'ancienne publication et son étiquette sont supprimées,
            # puis recréées sur le commit qui vient d'être compilé.
            gh release delete "$TAG" --cleanup-tag --yes > /dev/null 2>&1 || true
            gh release create "$TAG" mex-* SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "MEX - Dernière compilation" \
              --notes-file ../notes.md \
              --prerelease \
              --latest=false
          elif gh release view "$TAG" > /dev/null 2>&1; then
            # La version existe déjà (nouvelle exécution) : ses fichiers sont remplacés.
            gh release upload "$TAG" mex-* SHA256SUMS.txt --clobber
          else
            # Une étiquette comme v0.5.1-beta1 donne une préversion.
            options=()
            case "$TAG" in *-*) options+=(--prerelease) ;; esac
            # --target : crée l'étiquette si elle n'existe pas encore (publication lancée à
            # la main) ; sans effet si elle existe déjà.
            gh release create "$TAG" mex-* SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "MEX $TAG" \
              --notes-file ../notes.md \
              --generate-notes \
              "${options[@]}"
          fi
          url=$(gh release view "$TAG" --json url --jq .url)
          echo "Publié : $url" | tee -a "$GITHUB_STEP_SUMMARY"
